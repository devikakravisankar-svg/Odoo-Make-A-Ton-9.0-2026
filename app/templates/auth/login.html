{% extends 'base.html' %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="auth-header">
    <h2>Welcome Back</h2>
    <p>Sign in to access your subscriptions and dashboard</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <div class="form-group">
      <label class="form-label" for="login_id">Username or Email</label>
      <input type="text" id="login_id" name="login_id" class="form-control" value="{{ login_id or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label class="form-label" for="password">Password</label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.8rem; color: var(--primary-color);">Forgot Password?</a>
      </div>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember" style="font-size: 0.85rem; cursor: pointer;">Remember me on this device</label>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
  </form>

  <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
    Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary-color); font-weight: 600;">Register as Customer</a>
  </p>
</div>
{% endblock %}
