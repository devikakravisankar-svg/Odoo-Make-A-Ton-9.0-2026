{% extends 'base.html' %}
{% block title %}Create Discount Rule{% endblock %}

{% block content %}
<div class="auth-box" style="max-width: 550px; margin: 1.5rem auto;">
  <div class="auth-header">
    <h2>Create Discount Rule</h2>
    <p>Define promotion coupons (Admin privileges required)</p>
  </div>

  <form method="POST" action="{{ url_for('dashboard.create_discount') }}">
    <div class="form-group">
      <label class="form-label" for="code">Discount Code *</label>
      <input type="text" id="code" name="code" class="form-control" required placeholder="e.g. SUMMER2026" style="text-transform: uppercase;">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="discount_type">Discount Type</label>
        <select id="discount_type" name="discount_type" class="form-control">
          <option value="percentage">Percentage (%)</option>
          <option value="fixed">Fixed Amount ($)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="value">Value *</label>
        <input type="number" step="0.01" min="0.01" id="value" name="value" class="form-control" required placeholder="15.00">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="min_purchase_amount">Minimum Purchase Amount ($)</label>
      <input type="number" step="0.01" min="0" id="min_purchase_amount" name="min_purchase_amount" class="form-control" value="0.00">
    </div>

    <div class="form-group">
      <label class="form-label" for="usage_limit">Usage Limit (Leave blank for unlimited)</label>
      <input type="number" min="1" id="usage_limit" name="usage_limit" class="form-control" placeholder="Optional max uses">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label class="form-label" for="valid_from">Valid From</label>
        <input type="date" id="valid_from" name="valid_from" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label" for="valid_until">Valid Until</label>
        <input type="date" id="valid_until" name="valid_until" class="form-control">
      </div>
    </div>

    <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
      <a href="{{ url_for('dashboard.discount_list') }}" class="btn btn-outline" style="flex: 1;">Cancel</a>
      <button type="submit" class="btn btn-primary" style="flex: 2;">Save Discount Rule</button>
    </div>
  </form>
</div>
{% endblock %}
